name: adr-index freshness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  index-fresh:
    name: generated ADR indexes are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check generated README, Markdown, and JSON indexes
        run: |
          chmod +x bin/adr-index
          python bin/adr-index --check docs/adr
