name: ADR readiness

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  adr-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/adr-readiness
        with:
          adr-dir: docs/adr
