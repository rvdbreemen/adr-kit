name: ADR Kit release publish

# Publishes a tagged adr-kit version to the three certified coding-agent
# marketplaces and stages the repository-native OpenCode package for npm.
#
# The three certified marketplaces (Claude Code, Codex, GitHub Copilot) resolve
# adr-kit directly from this public repository. OpenCode loads the package source
# from the repository or a separately published npm package. For this repository,
# "publishing" is: land version-consistent manifests on the public repo and cut a
# tag + GitHub Release. This workflow is the gate that proves the tagged commit is
# coherent across every declared source surface before the Release is created. It
# then calls the reusable OpenCode npm workflow to stage the package through OIDC;
# a maintainer still approves the staged package with npm 2FA. It does NOT mutate
# any maintainer machine: the per-user prepared-directory marketplace is advanced
# locally with `python scripts/install-agent-envs.py --clients all` (see
# docs/RELEASING.md).

on:
  # Three entry points, one workflow. The push-to-main trigger is what makes a
  # misplaced tag impossible: the tag is derived from the commit that carries
  # the CHANGELOG version rather than typed by a human against the wrong ref.
  # It stays in THIS file because npm validates the Trusted Publisher against
  # the filename of the workflow that initiates the run (ADR-042).
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.55.1
        required: true
        type: string

permissions:
  contents: write # create the release tag on a push to main, and the GitHub Release

jobs:
  # Decide which tag this run publishes, and for a push to main create it.
  # Separated from publishing so the tag exists before the publish job checks
  # it out, and so a routine push to main that carries no new version ends the
  # run quietly instead of failing.
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      proceed: ${{ steps.tag.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve tag
        id: tag
        shell: bash
        # inputs.tag reaches the script through the environment, never through
        # ${{ }} interpolation into the shell source.
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Push to main. The CHANGELOG heading is the canonical version
            # (ADR-013), so the tag is derived from the commit under test
            # rather than from whatever a human had checked out.
            VERSION="$(python scripts/check-release-version.py --print-canonical)"
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::notice::$TAG already exists; nothing to release on this push."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::main carries $VERSION with no tag; creating $TAG at $GITHUB_SHA"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Carry the resolved tag
        id: tag
        shell: bash
        env:
          RESOLVED_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RESOLVED_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Gate 1 - every declared publish/source surface (3 certified plugin.json,
      # OpenCode package.json, 2 marketplace.json, CHANGELOG) must equal the tag
      # version. This is the check that would have caught the 0.37.0 marketplace lag.
      - name: Version consistency across certified clients and OpenCode
        run: python scripts/check-release-version.py --expect "${{ steps.tag.outputs.tag }}"

      # Gate 2 - the generated client adapters must not have drifted from source.
      - name: Client adapter drift check
        run: python scripts/build-client-adapters.py --check

      - name: Install test dependency
        run: python -m pip install --quiet pytest

      # Gate 3 - repository governance and tests are green.
      - name: ADR lint (strict)
        run: python bin/adr-lint --strict docs/adr

      - name: ADR index check
        run: python bin/adr-index --check docs/adr

      - name: Unit tests
        run: python -m pytest -q

      # Extract the CHANGELOG section for this version as the Release body.
      - name: Assemble release notes
        id: notes
        shell: bash
        run: |
          VER="${{ steps.tag.outputs.version }}"
          awk -v ver="$VER" '
            $0 ~ ("^## \\[" ver "\\]") { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG section found for [$VER]"; exit 1
          fi
          echo "Release notes for $VER:"; cat release-notes.md

      # Publish: create (or update) the GitHub Release for the tag. End users on
      # the public git-source marketplaces pull the new version from the tagged
      # manifests; this Release is the human-visible publication record.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "adr-kit $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "adr-kit $TAG" --notes-file release-notes.md
          fi

      - name: Local-machine publish reminder
        run: |
          echo "::notice::Public git-source marketplaces now serve ${{ steps.tag.outputs.tag }}."
          echo "::notice::Maintainer machines using the prepared-directory source must run:"
          echo "::notice::  python scripts/install-agent-envs.py --clients all   (then restart each client)"

      # The npm approval is the one step that cannot be automated: npm requires
      # proof-of-presence. It used to live only in docs/RELEASING.md, which is
      # why 0.53.0, 0.54.0 and 0.55.1 sat staged and unapproved for a week. It
      # now appears in the run that created the staging (ADR-042).
      - name: Write the remaining manual steps to the job summary
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Still to do by hand: approve the npm package

          The OpenCode package for \`$TAG\` is **staged, not published**. npm
          requires proof-of-presence, so no workflow can finish this.

          \`\`\`bash
          npm login
          npm stage list @rvdbreemen/adr-kit-opencode
          npm stage view <stage-id>      # inspect the tarball first
          npm stage approve <stage-id>   # prompts for your OTP
          \`\`\`

          Or from the browser: <https://www.npmjs.com/staged-packages>

          ### Approve in ascending version order

          npm sets \`latest\` to the version published **last**, not the highest.
          Approving an older staged version after a newer one moves \`latest\`
          backwards. This happened on 2026-08-26: approving 0.55.1, then 0.53.0,
          then 0.54.0 left \`latest\` on 0.54.0 while 0.55.1 was the release.

          Confirm afterwards:

          \`\`\`bash
          npm dist-tag ls @rvdbreemen/adr-kit-opencode   # latest must be $VERSION
          \`\`\`
          SUMMARY

  stage-opencode-npm:
    name: Stage OpenCode package for npm
    needs: publish
    uses: ./.github/workflows/publish-opencode-npm.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    permissions:
      contents: read
      id-token: write
