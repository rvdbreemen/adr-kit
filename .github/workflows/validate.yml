name: validate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json syntax
        run: jq empty .claude-plugin/plugin.json

      - name: Validate marketplace.json syntax
        run: jq empty .claude-plugin/marketplace.json

      - name: Validate native Codex and Copilot JSON syntax
        run: |
          jq empty .agents/plugins/marketplace.json
          jq empty codex/.codex-plugin/plugin.json
          jq empty codex/.mcp.json
          jq empty .github/plugin/marketplace.json
          jq empty copilot/plugin.json
          jq empty copilot/.mcp.json

      - name: Setup Node.js for ajv-cli
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate plugin.json against schema
        run: ajv validate -s schemas/plugin.json.schema.json -d .claude-plugin/plugin.json --spec=draft7 -c ajv-formats

      - name: Validate marketplace.json against schema
        run: ajv validate -s schemas/marketplace.json.schema.json -d .claude-plugin/marketplace.json --spec=draft7 -c ajv-formats

      - name: Validate generated ADR graph against schema
        run: ajv validate -s schemas/adr-index.schema.json -d docs/adr/ADR-INDEX.json --spec=draft2020 -c ajv-formats

      - name: Validate selective-context probes against schema
        run: ajv validate -s schemas/adr-context-probes.schema.json -d docs/adr/adr-context-probes.json --spec=draft2020 -c ajv-formats

      - name: Verify required files exist
        run: |
          required_files=(
            ".claude-plugin/plugin.json"
            ".claude-plugin/marketplace.json"
            ".agents/plugins/marketplace.json"
            "codex/.codex-plugin/plugin.json"
            "codex/.mcp.json"
            "copilot/plugin.json"
            "copilot/.mcp.json"
            ".github/plugin/marketplace.json"
            "scripts/install-agent-envs.py"
            "scripts/sync-agent-plugins.py"
            "schemas/plugin.json.schema.json"
            "schemas/marketplace.json.schema.json"
            "schemas/adr-kit-config.schema.json"
            "schemas/adr-index.schema.json"
            "schemas/adr-context-probes.schema.json"
            "schemas/adr-enforcement.schema.json"
            "schemas/adr-readiness.schema.json"
            "skills/adr/SKILL.md"
            "skills/grill/SKILL.md"
            "skills/setup/SKILL.md"
            "skills/lint/SKILL.md"
            "skills/migrate/SKILL.md"
            "skills/init/SKILL.md"
            "skills/judge/SKILL.md"
            "skills/retire/SKILL.md"
            "skills/context/SKILL.md"
            "skills/install-hooks/SKILL.md"
            "skills/upgrade/SKILL.md"
            "agents/adr-generator.md"
            "instructions/adr.coding.md"
            "instructions/adr.review.md"
            "templates/adr-template.md"
            "templates/adr-kit-guide.md"
            "templates/githooks/pre-commit"
            "templates/github-workflows/adr-readiness.yml"
            ".github/actions/adr-readiness/action.yml"
            "bin/adr-lint"
            "bin/adr-readiness"
            "bin/adr-readiness-ci"
            "bin/adr-grill-signal"
            "bin/adr-index"
            "bin/adr_catalog.py"
            "bin/adr-judge"
            "bin/adr-discover"
            "bin/adr-retire"
            "tests/test_adr_lint.py"
            "tests/test_adr_judge.py"
            "tests/test_adr_judge_llm.py"
            "tests/test_adr_discover.py"
            "tests/test_adr_status_history.py"
            "tests/test_adr_retire.py"
            "examples/ADR-template.md"
            "examples/.adr-kit.sample.json"
            "docs/adr/ADR-INDEX.json"
            "docs/adr/adr-context-probes.json"
            "examples/ADR-sample-003-grandfathered-legacy.md"
            "README.md"
            "INSTALL.md"
            "LICENSE"
            "CHANGELOG.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: required file missing: $f"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

      - name: Verify plugin.json version matches CHANGELOG top entry
        run: |
          manifest_version=$(jq -r '.version' .claude-plugin/plugin.json)
          changelog_version=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          echo "plugin.json version: $manifest_version"
          echo "CHANGELOG top version: $changelog_version"
          if [ "$manifest_version" != "$changelog_version" ]; then
            echo "ERROR: plugin.json version ($manifest_version) does not match CHANGELOG top entry ($changelog_version)"
            exit 1
          fi

      - name: Verify every client manifest uses the release version
        run: |
          expected=$(jq -r '.version' .claude-plugin/plugin.json)
          test "$(jq -r '.version' codex/.codex-plugin/plugin.json)" = "$expected"
          test "$(jq -r '.version' copilot/plugin.json)" = "$expected"
          test "$(jq -r '.plugins[0].version' .github/plugin/marketplace.json)" = "$expected"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify generated client payloads and integration tests
        run: |
          python scripts/build-client-adapters.py --check
          python scripts/build-client-adapters.py --certify tests/certification/simulated-pass.json --candidate-commit simulated-task40 --support-output docs/client-support.md --check
          python bin/adr-index --check docs/adr
          python -m pip install pytest
          python -m pytest tests/test_agent_installer.py tests/test_adr_mcp.py tests/test_bump_version.py tests/test_python_check.py tests/test_documentation_contracts.py tests/test_packaging_contract.py tests/test_client_adapter_generation.py tests/test_client_generator_performance.py tests/test_release_allowlist.py tests/test_client_certification.py

      # The kit's own ADRs, at the default gate set. Until now this ran only in
      # the Monday guardian cron and, with --strict, at release, so a missing
      # required section or a duplicate number could merge and sit for a week.
      # --strict stays at release: it adds checks too slow for every push.
      - name: Lint this repository's own ADRs
        run: python bin/adr-lint docs/adr

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            skills/**/*.md
            codex/skills/**/*.md
            copilot/skills/**/*.md
            agents/**/*.md
            instructions/**/*.md
            examples/**/*.md
            templates/**/*.md
          config: ".markdownlint.json"

  python-compatibility:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run the complete supported-runtime suite
        run: python -m pytest -q
