name: ADR readiness

on:
  pull_request:

permissions:
  contents: read

jobs:
  adr-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: rvdbreemen/adr-kit/.github/actions/adr-readiness@v0.55.1
        with:
          adr-dir: docs/adr
